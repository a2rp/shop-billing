<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Shop Billing | Simple browser billing</title>
    <meta name="description" content="A lightweight browser billing app for small shops with discounts, saved bills, printing, and local draft storage." />
    <meta property="og:title" content="Shop Billing" />
    <meta property="og:description" content="Create, save, search, and print shop bills directly in the browser." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://a2rp.github.io/shop-billing/" />
    <meta property="og:image" content="https://a2rp.github.io/shop-billing/preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="./public/favicon.ico" />
    <link rel="preload" as="image" href="./public/logo.png" />
</head>

<body>
    <header class="app-header">
        <div class="brand-lockup">
            <a class="brand-logo" href="./" aria-label="Shop Billing home">
                <img src="./public/logo.png" alt="" />
            </a>
            <div class="store-meta">
                <h1 id="storeNameText">Your Store</h1>
                <div class="store-sub">
                    <span id="storeAddressText">Address line</span>
                    <span aria-hidden="true">•</span>
                    <span id="storePhoneText">Phone</span>
                </div>
            </div>
        </div>

        <nav class="actions">
            <button id="btnNewBill" title="New Bill (Alt+N)">New</button>
            <button id="btnSaveBill" title="Save Bill (Ctrl+S)">Save</button>
            <button id="btnPrint" title="Print (Ctrl+P)">Print</button>
            <!-- History button removed -->
            <button id="btnClearDraft" class="danger" title="Clear Draft">Clear</button>
            <button id="btnSettings" class="ghost" title="Settings">Settings</button>
        </nav>
    </header>

    <section class="bill-info">
        <div>
            <strong>Bill No:</strong>
            <span id="billNumberBadge">DRAFT</span>
        </div>
        <div>
            <strong>Date/Time:</strong>
            <span id="billDateTime"></span>
        </div>
        <div>
            <strong>Series:</strong>
            <span id="billSeriesText">SB</span>
        </div>
    </section>

    <main class="content">
        <section class="items-card">
            <div class="items-head">
                <h2>Items</h2>
                <button id="btnAddRow">+ Add Row</button>
            </div>

            <div class="table-wrap">
                <table class="items-table" id="itemsTable" aria-label="Billing items">
                    <thead>
                        <tr>
                            <th style="width: 36%">Item Name</th>
                            <th style="width: 12%">Price</th>
                            <th style="width: 10%">Qty</th>
                            <th style="width: 12%">Disc Type</th>
                            <th style="width: 12%">Disc Value</th>
                            <th style="width: 14%">Line Total</th>
                            <th style="width: 4%"></th>
                        </tr>
                    </thead>
                    <tbody id="itemsTbody"></tbody>
                </table>
            </div>

            <div class="bill-discount">
                <label>
                    Bill Discount
                    <select id="billDiscType" aria-label="Bill discount type">
                        <option value="percent">%</option>
                        <option value="amount">₹</option>
                    </select>
                    <input id="billDiscValue" type="number" step="0.01" min="0" value="0" />
                </label>
            </div>

            <div class="totals">
                <div class="total-row">
                    <span>Sub-total</span>
                    <strong id="subTotalText">₹0.00</strong>
                </div>
                <div class="total-row">
                    <span>Bill Discount</span>
                    <strong id="billDiscountAmountText">₹0.00</strong>
                </div>
                <div class="total-row grand">
                    <span>Grand Total</span>
                    <strong id="grandTotalText">₹0.00</strong>
                </div>
            </div>

            <div class="notes">
                <label>
                    Note
                    <input id="noteInput" type="text" placeholder="Optional note on the bill" />
                </label>
            </div>
        </section>

        <!-- History panel is now always visible (hidden removed) -->
        <aside id="historyPanel" class="history-panel" aria-label="Saved bills history">
            <div class="history-head">
                <h3>Saved Bills</h3>
                <input id="historySearch" type="search" placeholder="Search bill no or date…" />
            </div>
            <ul id="historyList" class="history-list"></ul>
        </aside>
    </main>

    <!-- Settings Modal -->
    <dialog id="settingsDialog">
        <form method="dialog" class="settings-form">
            <h3>Store Settings</h3>
            <label>Store Name <input id="setStoreName" type="text" required /></label>
            <label>Address <input id="setStoreAddress" type="text" /></label>
            <label>Phone <input id="setStorePhone" type="text" /></label>
            <div class="row">
                <label>Bill Series <input id="setBillSeries" type="text" maxlength="6" /></label>
                <label>Next Number <input id="setNextNumber" type="number" min="1" step="1" /></label>
            </div>

            <menu class="settings-actions">
                <button value="cancel" class="ghost">Cancel</button>
                <button id="btnSaveSettings" value="default">Save</button>
            </menu>
        </form>
    </dialog>

    <div id="printArea" class="print-area" aria-hidden="true"></div>

    <footer class="app-footer">
        <div class="footer-copy">Copyright &copy; <span id="currentYear"></span> <a href="https://www.ashishranjan.net/" target="_blank" rel="noopener noreferrer">Ashish Ranjan</a></div>
        <div class="footer-links" aria-label="Social and support links">
            <a href="https://www.ashishranjan.net/" target="_blank" rel="noopener noreferrer" aria-label="Portfolio" title="Portfolio"><span aria-hidden="true">↗</span></a>
            <a href="https://github.com/a2rp" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub"><span aria-hidden="true">GH</span></a>
            <a href="https://codepen.io/ash1198" target="_blank" rel="noopener noreferrer" aria-label="CodePen" title="CodePen"><span aria-hidden="true">CP</span></a>
            <a href="https://www.linkedin.com/in/aashishranjan" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn"><span aria-hidden="true">in</span></a>
            <a href="https://www.facebook.com/theash.ashish/" target="_blank" rel="noopener noreferrer" aria-label="Facebook" title="Facebook"><span aria-hidden="true">f</span></a>
            <a href="https://www.youtube.com/@ashishranjan-ashz?sub_confirmation=1" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube"><span aria-hidden="true">▶</span></a>
            <a href="https://a2rp-donation-page.netlify.app/" target="_blank" rel="noopener noreferrer" aria-label="Support" title="Support"><span aria-hidden="true">♥</span></a>
            <a href="https://buymeacoffee.com/a2rp" target="_blank" rel="noopener noreferrer" aria-label="Buy Me a Coffee" title="Buy Me a Coffee"><span aria-hidden="true">☕</span></a>
            <a href="https://patreon.com/a2rp" target="_blank" rel="noopener noreferrer" aria-label="Patreon" title="Patreon"><span aria-hidden="true">P</span></a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
